name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install library dependencies
        run: flutter pub get

      - name: Analyze library
        run: flutter analyze lib

      - name: Run library tests
        run: flutter test

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze lib

      # Advisory only: this repo is consumed via a git dependency on purpose
      # (see pubspec.yaml comments in consumer apps) and isn't published to
      # pub.dev on every push — actual publishing is a separate, manual
      # workflow. `dart pub publish --dry-run` reliably reports non-fatal
      # issues here that aren't real problems: a "not an incremental update"
      # hint whenever pubspec.yaml's version has been bumped ahead of the
      # last version actually published to pub.dev (the norm for this repo),
      # and a "checked-in files are modified in git" warning caused by the
      # earlier `flutter pub get`/`flutter analyze` steps rewriting
      # `pubspec.lock`/`analysis_options.yaml` as a side effect. Either one
      # makes `dart pub publish --dry-run` exit non-zero even though nothing
      # is actually wrong with the package, so this step must not fail the
      # job — keep it for visibility (check its output before a real
      # release), but don't gate merges on it.
      - name: Publish dry-run
        run: dart pub publish --dry-run
        continue-on-error: true
